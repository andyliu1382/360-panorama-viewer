<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° Panorama Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f17;
    --surface: #1a1a28;
    --border: rgba(255,255,255,0.1);
    --text: #e0e0f0;
    --text-muted: #8888aa;
    --accent: #6699ff;
    --radius: 12px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--text);
  }

  header span {
    font-size: 12px;
    color: var(--text-muted);
    background: rgba(255,255,255,0.06);
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
  }

  #main {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Drop zone */
  #drop-zone {
    border: 1.5px dashed rgba(255,255,255,0.2);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: var(--surface);
  }
  #drop-zone:hover, #drop-zone.over {
    border-color: var(--accent);
    background: rgba(102,153,255,0.06);
  }
  #drop-zone svg { opacity: .4; margin-bottom: 12px; }
  #drop-zone p { font-size: 15px; color: var(--text-muted); margin-bottom: 6px; }
  #drop-zone .hint { font-size: 12px; color: rgba(255,255,255,0.28); }
  #file-input { display: none; }

  /* Gallery */
  #gallery-wrap { display: none; }
  #gallery {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .thumb {
    width: 80px; height: 50px;
    border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.12);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: border-color .15s;
    flex-shrink: 0;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.active { border-color: var(--accent); }
  .thumb .del {
    position: absolute; top: 3px; right: 3px;
    background: rgba(0,0,0,0.65);
    border-radius: 50%; width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: white; cursor: pointer;
    opacity: 0; transition: opacity .1s;
  }
  .thumb:hover .del { opacity: 1; }
  .thumb-name {
    position: absolute; bottom: 0; left: 0; right: 0;
    font-size: 9px; color: white;
    background: rgba(0,0,0,0.55);
    padding: 2px 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Viewer */
  #viewer-wrap {
    position: relative;
    width: 100%; height: 540px;
    background: #06060f;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    overflow: hidden;
    cursor: grab;
    user-select: none;
    display: none;
  }
  #viewer-wrap.dragging { cursor: grabbing; }
  #pano-canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 16px; pointer-events: none;
  }
  .badge {
    font-size: 11px;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.55);
    color: #ccd;
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid rgba(255,255,255,0.1);
    letter-spacing: .04em;
    backdrop-filter: blur(4px);
  }
  #hud-left { display: flex; flex-direction: column; gap: 5px; }
  #hud-right { display: flex; gap: 6px; align-items: flex-start; pointer-events: all; }

  /* Controls */
  #controls {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; pointer-events: all;
  }
  .ctrl {
    background: rgba(0,0,0,0.55);
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #ccd;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    transition: background .12s;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  .ctrl:hover { background: rgba(255,255,255,0.12); }
  .ctrl.on { background: rgba(102,153,255,0.25); border-color: rgba(102,153,255,0.5); }

  /* Crosshair */
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 22px; height: 22px;
    pointer-events: none; opacity: .28;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: white;
  }
  #crosshair::before { width: 1px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after  { height: 1px; width: 100%; top: 50%;  transform: translateY(-50%); }

  /* Empty state overlay */
  #empty-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--text-muted); font-size: 14px;
    pointer-events: none;
  }

  /* Instructions */
  #instructions {
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    text-align: center;
    padding-top: 4px;
    line-height: 1.8;
  }

  /* Responsive */
  @media (max-width: 600px) {
    #viewer-wrap { height: 300px; }
    header h1 { font-size: 15px; }
    .ctrl { font-size: 11px; padding: 5px 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>⬡ 360° Panorama Viewer</h1>
  <span>equirectangular · drag to explore</span>
</header>

<div id="main">

  <div id="drop-zone">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M4 16l4-4 4 4 4-8 4 8"/><rect x="2" y="3" width="20" height="18" rx="2"/>
    </svg>
    <p>Click or drag &amp; drop your 360° panorama image</p>
    <p class="hint">Supports equirectangular JPG · PNG · WebP &nbsp;·&nbsp; Multiple files OK</p>
    <input type="file" id="file-input" accept="image/*" multiple>
  </div>

  <div id="gallery-wrap">
    <div id="gallery"></div>
  </div>

  <div id="viewer-wrap">
    <canvas id="pano-canvas"></canvas>
    <div id="hud">
      <div id="hud-left">
        <div class="badge" id="angle-badge">↔ 0°&nbsp;&nbsp;↕ 0°</div>
        <div class="badge" id="img-name-badge"></div>
      </div>
      <div id="hud-right">
        <div class="badge" id="fov-badge">FOV 75°</div>
        <button class="ctrl" id="btn-change" style="padding:4px 10px;font-size:11px">＋ add image</button>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="controls">
      <button class="ctrl" id="btn-auto">⟳ auto-rotate</button>
      <button class="ctrl" id="btn-reset">⌖ reset</button>
      <button class="ctrl" id="btn-zi">＋ zoom</button>
      <button class="ctrl" id="btn-zo">－ zoom</button>
    </div>
  </div>

  <p id="instructions">
    🖱 Drag to look around &nbsp;·&nbsp; Scroll wheel to zoom &nbsp;·&nbsp; Upload multiple images to build a gallery
  </p>

</div>

<script>
(function () {
  const dz = document.getElementById('drop-zone');
  const fi = document.getElementById('file-input');
  const vw = document.getElementById('viewer-wrap');
  const canvas = document.getElementById('pano-canvas');
  const ctx = canvas.getContext('2d');
  const angleBadge = document.getElementById('angle-badge');
  const imgNameBadge = document.getElementById('img-name-badge');
  const fovBadge = document.getElementById('fov-badge');
  const gallery = document.getElementById('gallery');
  const galleryWrap = document.getElementById('gallery-wrap');

  let yaw = 0, pitch = 0, fov = 75;
  let autoRot = false, dragging = false, lx = 0, ly = 0;
  let images = [], offCanvas = null;

  /* ── Image loading ── */
  function addImages(files) {
    Array.from(files).forEach(f => {
      if (!f.type.startsWith('image/')) return;
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        const oc = document.createElement('canvas');
        oc.width = img.naturalWidth;
        oc.height = img.naturalHeight;
        oc.getContext('2d').drawImage(img, 0, 0);
        const entry = { name: f.name, canvas: oc, thumbUrl: url };
        images.push(entry);
        addThumb(entry, images.length - 1);
        galleryWrap.style.display = 'flex';
        if (images.length === 1) loadScene(0);
      };
      img.src = url;
    });
  }

  function addThumb(entry, idx) {
    const t = document.createElement('div');
    t.className = 'thumb'; t.dataset.idx = idx;
    const im = document.createElement('img');
    im.src = entry.thumbUrl; im.alt = entry.name;
    const del = document.createElement('div');
    del.className = 'del'; del.textContent = '×';
    del.addEventListener('click', e => { e.stopPropagation(); removeImage(idx); });
    const nm = document.createElement('div');
    nm.className = 'thumb-name';
    nm.textContent = entry.name.replace(/\.[^.]+$/, '');
    t.appendChild(im); t.appendChild(del); t.appendChild(nm);
    t.addEventListener('click', () => loadScene(idx));
    gallery.appendChild(t);
  }

  function removeImage(idx) {
    images.splice(idx, 1);
    gallery.innerHTML = '';
    images.forEach((e, i) => addThumb(e, i));
    if (images.length === 0) {
      galleryWrap.style.display = 'none';
      vw.style.display = 'none';
      dz.style.display = '';
      offCanvas = null;
    } else {
      loadScene(0);
    }
  }

  function loadScene(idx) {
    offCanvas = images[idx].canvas;
    document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
    imgNameBadge.textContent = images[idx].name.replace(/\.[^.]+$/, '');
    yaw = 0; pitch = 0; fov = 75;
    vw.style.display = 'block';
    dz.style.display = 'none';
    resize();
  }

  /* ── Canvas sizing ── */
  function resize() {
    const W = vw.clientWidth || 960, H = vw.clientHeight || 540;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  /* ── Ray-cast equirectangular renderer ── */
  function draw() {
    if (!offCanvas) return;
    const W = canvas.width, H = canvas.height;
    const iW = offCanvas.width, iH = offCanvas.height;
    const src = offCanvas.getContext('2d').getImageData(0, 0, iW, iH).data;
    const out = ctx.createImageData(W, H);
    const dst = out.data;

    const yawR = yaw * Math.PI / 180;
    const pitchR = pitch * Math.PI / 180;
    const fovR = fov * Math.PI / 180;
    const f = (H / 2) / Math.tan(fovR / 2);

    const cosPitch = Math.cos(pitchR), sinPitch = Math.sin(pitchR);
    const cosYaw   = Math.cos(yawR),   sinYaw   = Math.sin(yawR);

    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        let rx = (px - W / 2) / f;
        let ry = -(py - H / 2) / f;   // flip Y: screen-down → world-up
        const len = Math.sqrt(rx * rx + ry * ry + 1);
        rx /= len; ry /= len; let rz = 1 / len;

        // pitch rotation (X-axis)
        const ry2 =  ry * cosPitch - rz * sinPitch;
        const rz2 =  ry * sinPitch + rz * cosPitch;

        // yaw rotation (Y-axis)
        const rx3 =  rx * cosYaw + rz2 * sinYaw;
        const rz3 = -rx * sinYaw + rz2 * cosYaw;
        const ry3 = ry2;

        // spherical → equirectangular UV
        const lon = Math.atan2(rx3, rz3);
        const lat = Math.asin(Math.max(-1, Math.min(1, ry3)));
        const u = (lon / (2 * Math.PI)) + 0.5;
        const v = 0.5 - (lat / Math.PI);

        const sx = Math.floor(((u % 1 + 1) % 1) * iW);
        const sy = Math.floor(Math.min(v, 0.9999) * iH);
        const si = (sy * iW + sx) * 4;
        const di = (py * W + px) * 4;
        dst[di]     = src[si];
        dst[di + 1] = src[si + 1];
        dst[di + 2] = src[si + 2];
        dst[di + 3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);

    angleBadge.textContent = `↔ ${Math.round((yaw % 360 + 360) % 360)}°  ↕ ${Math.round(pitch)}°`;
    fovBadge.textContent = `FOV ${Math.round(fov)}°`;
  }

  /* ── Render loop ── */
  function loop() {
    if (autoRot && !dragging) yaw = (yaw + 0.15) % 360;
    draw();
    requestAnimationFrame(loop);
  }

  /* ── Events ── */
  dz.addEventListener('click', () => fi.click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); addImages(e.dataTransfer.files); });
  fi.addEventListener('change', e => { addImages(e.target.files); fi.value = ''; });
  document.getElementById('btn-change').addEventListener('click', () => fi.click());

  // Mouse
  vw.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; vw.classList.add('dragging'); });
  document.addEventListener('mouseup', () => { dragging = false; vw.classList.remove('dragging'); });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    yaw   -= (e.clientX - lx) * (fov / canvas.width) * 1.8;
    pitch  = Math.max(-85, Math.min(85, pitch - (e.clientY - ly) * (fov / canvas.height) * 1.8));
    lx = e.clientX; ly = e.clientY;
  });

  // Touch
  vw.addEventListener('touchstart', e => { dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', () => dragging = false);
  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    yaw   -= (e.touches[0].clientX - lx) * (fov / canvas.width) * 1.8;
    pitch  = Math.max(-85, Math.min(85, pitch - (e.touches[0].clientY - ly) * (fov / canvas.height) * 1.8));
    lx = e.touches[0].clientX; ly = e.touches[0].clientY;
  }, { passive: true });

  // Wheel zoom
  vw.addEventListener('wheel', e => { e.preventDefault(); fov = Math.max(25, Math.min(110, fov + e.deltaY * 0.05)); }, { passive: false });

  // Buttons
  document.getElementById('btn-auto').addEventListener('click', function () { autoRot = !autoRot; this.classList.toggle('on', autoRot); });
  document.getElementById('btn-reset').addEventListener('click', () => { yaw = 0; pitch = 0; fov = 75; });
  document.getElementById('btn-zi').addEventListener('click', () => fov = Math.max(25, fov - 8));
  document.getElementById('btn-zo').addEventListener('click', () => fov = Math.min(110, fov + 8));

  window.addEventListener('resize', () => { if (offCanvas) resize(); });
  loop();
})();
</script>
</body>
</html>
